<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eutopias</title>
  <meta name="description" content="Mission-driven storytelling that elevates real-world solutions through multimedia. Discover inspiring stories, innovative ideas, and transformative content." />
  <meta property="og:title" content="Eutopias" />
  <meta property="og:site_name" content="Eutopias" />
  <meta property="og:type" content="website" />
  <meta property="og:description" content="Mission-driven storytelling that elevates real-world solutions through multimedia." />
  <meta property="og:image" content="https://eutopias-magazine-media.s3.us-east-2.amazonaws.com/uploads/eutopias-blue-circle-300x300.webp" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    @font-face { font-family: "Vanitas"; src: url("/Vanitas-Extrabold.woff2") format("woff2"); font-weight: 800; font-display: swap; }
    :root { --navy: #003366; --gold: #eebc2a; --bg: #ffffff; --fg: #1b2430; --muted: #5b6675; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1626; --fg: #eef2f7; --muted: #a3afbf; --navy: #8fb8e8; } }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.6; display: flex; flex-direction: column; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px 16px; }
    img { width: 120px; height: 120px; object-fit: contain; margin-bottom: 16px; }
    h1 { font-family: "Vanitas", system-ui, sans-serif; font-weight: 800; letter-spacing: .04em; color: var(--navy); font-size: clamp(2.25rem, 8vw, 4rem); margin: 0 0 8px; }
    .bar { width: 64px; height: 4px; background: var(--gold); border-radius: 2px; margin: 0 auto 24px; }
    p { max-width: 36rem; margin: 0 auto 12px; color: var(--muted); font-size: 1.125rem; }
    .soon { color: var(--fg); font-weight: 600; }
    nav { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 24px; }
    nav a { padding: 10px 20px; border-radius: 999px; border: 2px solid var(--navy); color: var(--navy); text-decoration: none; font-weight: 600; }
    nav a:hover, nav a:focus-visible { background: var(--gold); border-color: var(--gold); color: #003366; }
    footer { padding: 24px 16px; text-align: center; font-size: .875rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <img src="https://eutopias-magazine-media.s3.us-east-2.amazonaws.com/uploads/eutopias-blue-circle-300x300.webp" alt="Eutopias logo" width="120" height="120" />
    <h1>EUTOPIAS</h1>
    <div class="bar"></div>
    <p>Mission-driven storytelling that elevates real-world solutions through multimedia.</p>
    <p class="soon">Our new site is on the way. Follow along in the meantime.</p>
    <nav aria-label="Social links">
      <a href="https://www.instagram.com/eutopias_co/" rel="noopener">Instagram</a>
      <a href="https://www.facebook.com/EutopiasCo" rel="noopener">Facebook</a>
      <a href="https://www.linkedin.com/company/eutopias-co/" rel="noopener">LinkedIn</a>
    </nav>
  </main>
  <footer>Copyright © 2025 Eutopias. All rights reserved.</footer>
</body>
</html>
